name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  NODE_VERSION: '24'
  TIMESTAMP: ''
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.t.outputs.timestamp }}
    steps:
      - id: t
        run: echo "timestamp=$(date +%Y-%m-%d_%H-%M)" >> $GITHUB_OUTPUT

  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        uses: azure/cli@v3
        with:
          inlineScript: |
            az group create \
              --name "rg-jatt-dev" \
              --location westus2

      - name: Validate Biceps
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: validate
          scope: resourceGroup
          resource-group-name: 'rg-jatt-dev'
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          template-file: ./infra/main.bicep
          parameters-file: ./infra/parameters.bicepparam

      - name: Create timestamp
        run: echo "TIMESTAMP=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV

      - name: Deploy Infrastructure
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: create
          scope: resourceGroup
          resource-group-name: 'rg-jatt-dev'
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          template-file: ./infra/main.bicep
          parameters-file: ./infra/parameters.bicepparam
          name: rg-jatt-dev-${{ env.TIMESTAMP }}

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      web_artifact_exists: ${{ steps.check_artifacts.outputs.web_exists }}
      api_artifact_exists: ${{ steps.check_artifacts.outputs.api_exists }}
      ai_service_affected: ${{ steps.check_artifacts.outputs.ai_affected }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5
        with:
          fallback-sha: 'e2a12bdd38b114c17971fdd29870130d6aa57a63'

      - name: Build, Test, and Publish affected projects
        run: |
          pnpm nx affected -t restore
          pnpm nx affected -t test build publish -c ci

      - name: Create API deployment package
        run: |
          # ensure dist exists
          mkdir -p dist
          # try dist/apps/jatt-api or apps/jatt-api/bin/Release/net10.0
          loc="dist/apps/jatt-api"
          if [ ! -d "$loc" ]; then
            echo "$loc not found"
            loc="apps/jatt-api/bin/Release/net10.0"
          fi

          if [ -d "$loc" ]; then
            echo "Creating API deployment package from $loc"
            zip -r dist/api.zip $loc
          else
            echo "No API deployment package found"
          fi

      - name: Check artifacts existence
        id: check_artifacts
        run: |
          if [ -d "dist/apps/jatt-web/browser" ]; then
            echo "jatt-web artifact found"
            echo "web_exists=true" >> $GITHUB_OUTPUT
          else
            echo "jatt-web artifact not found"
            echo "web_exists=false" >> $GITHUB_OUTPUT
          fi

          if [ -f "dist/api.zip" ]; then
            echo "api artifact found"
            echo "api_exists=true" >> $GITHUB_OUTPUT
          else
            echo "api artifact not found"
            echo "api_exists=false" >> $GITHUB_OUTPUT
          fi

          if pnpm nx show projects --affected | grep -q "jatt-ai-service"; then
            echo "jatt-ai-service affected"
            echo "ai_affected=true" >> $GITHUB_OUTPUT
          else
            echo "jatt-ai-service not affected"
            echo "ai_affected=false" >> $GITHUB_OUTPUT
          fi

      - name: Code Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/*.xml
          badge: true
          format: markdown
          output: both

      - name: Add Coverage Summary to Job Summary
        run: |
          if [ -f code-coverage-results.md ]; then
            cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage summary found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-artifact
          path: dist/apps/jatt-web/browser
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload API artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-artifact
          path: dist/api.zip
          retention-days: 1
          if-no-files-found: ignore

  build-ai-service:
    name: Build AI Service (Docker)
    needs: [setup, deploy-infra, build]
    if: needs.build.outputs.ai_service_affected == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          ACR_NAME="crjattdev"
          SERVICE_NAME="aca-jatt-dev"
          IMAGE_TAG="${{ github.sha }}"
          TIMESTAMP="${{ needs.setup.outputs.timestamp }}"

          az acr login --name $ACR_NAME
          docker build \
            --label "org.opencontainers.image.revision=${IMAGE_TAG}" \
            -t $ACR_NAME.azurecr.io/$SERVICE_NAME:$IMAGE_TAG \
            -f apps/jatt-ai-service/Dockerfile apps/jatt-ai-service
          docker push $ACR_NAME.azurecr.io/$SERVICE_NAME:$IMAGE_TAG

          docker tag $ACR_NAME.azurecr.io/$SERVICE_NAME:$IMAGE_TAG $ACR_NAME.azurecr.io/$SERVICE_NAME:$TIMESTAMP
          docker push $ACR_NAME.azurecr.io/$SERVICE_NAME:$TIMESTAMP

  deploy:
    name: Deploy Application
    needs: [setup, deploy-infra, build, build-ai-service]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Download web artifact
        if: needs.build.outputs.web_artifact_exists == 'true'
        uses: actions/download-artifact@v7
        with:
          name: web-artifact

      - name: Get SWA Deployment Token
        if: needs.build.outputs.web_artifact_exists == 'true'
        id: swa_token
        shell: bash
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "stapp-jatt-dev" \
            --resource-group "rg-jatt-dev" \
            --query "properties.apiKey" -o tsv)
          echo "SWA_TOKEN=$TOKEN" >> $GITHUB_OUTPUT

      - name: Deploy to Static Web App
        if: needs.build.outputs.web_artifact_exists == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '.'
          skip_app_build: true

      - name: Download api artifact
        if: needs.build.outputs.api_artifact_exists == 'true'
        uses: actions/download-artifact@v7
        with:
          name: api-artifact

      - name: Deploy to Azure Functions
        if: needs.build.outputs.api_artifact_exists == 'true'
        run: |
          az functionapp deployment source config-zip \
            --resource-group "rg-jatt-dev" \
            --name "func-jatt-dev" \
            --src api.zip

      - name: Update Container App
        if: needs.build.outputs.ai_service_affected == 'true'
        run: |
          ACR_NAME="crjattdev"
          SERVICE_NAME="aca-jatt-dev"
          IMAGE_TAG="${{ needs.setup.outputs.timestamp }}"

          az containerapp update \
            --name $SERVICE_NAME \
            --resource-group "rg-jatt-dev" \
            --image $ACR_NAME.azurecr.io/$SERVICE_NAME:$IMAGE_TAG
