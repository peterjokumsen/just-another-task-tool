name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/infrastructure.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  NODE_VERSION: '20'

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        uses: azure/setup-bicep@v4
        with:
          version: 'latest'

      - name: Validate Bicep files
        working-directory: ./infra
        run: bicep validate --file main.bicep

  deploy:
    name: Deploy to ${{ inputs.environment || 'dev' }}
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        uses: azure/setup-bicep@v4
        with:
          version: 'latest'

      - name: Create Resource Group
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create \
              --name "rg-jatt-${{ inputs.environment || 'dev' }}" \
              --location eastus

      - name: Deploy Infrastructure
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: "rg-jatt-${{ inputs.environment || 'dev' }}"
          template: ./infra/main.bicep
          parameters: ./infra/parameters.bicepparam
          environment: ${{ inputs.environment || 'dev' }}

      - name: Deploy Functions App
        run: |
          cd apps/jatt-api
          az functionapp deployment source config-zip \
            --resource-group "rg-jatt-${{ inputs.environment || 'dev' }}" \
            --name "func-jatt-${{ inputs.environment || 'dev' }}" \
            --src ./dist.zip 2>/dev/null || echo "Functions package not found, skipping"

      - name: Deploy Static Web App
        run: |
          az staticwebapp distribution show \
            --name "stapp-jatt-${{ inputs.environment || 'dev' }}" 2>/dev/null && \
          echo "Static web app will be deployed via Azure Static Web Apps CI/CD"

      - name: Azure Logout
        run: az logout
