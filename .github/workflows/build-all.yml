name: Build All

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  build-and-test:
    name: Build and Test Affected Projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4
        with:
          fallback-sha: 'e2a12bdd38b114c17971fdd29870130d6aa57a63'

      - name: Build, Test, and Publish affected projects
        run: |
          pnpm nx affected -t restore
          pnpm nx affected -t test build publish -c ci

      - name: Create API deployment package
        run: |
          if [ -d "dist/apps/jatt-api" ]; then
            cd dist/apps
            zip -r ../api.zip jatt-api
            cd ../..
          fi

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-artifact
          path: dist/apps/jatt-web/browser
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-artifact
          path: dist/api.zip
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-artifact
          path: apps/jatt-mobile/android/app/build/outputs/apk
          retention-days: 1
          if-no-files-found: ignore
