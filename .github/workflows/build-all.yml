name: Build All

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  test-affected:
    name: Test Affected Projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test affected projects
        run: pnpm nx affected:test --configuration=ci --base=origin/main --head=${{ github.sha }}

  build-web:
    name: Build Web (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Angular Web App
        run: pnpm nx build jatt-web --configuration=production

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-artifact
          path: dist/apps/jatt-web/browser
          retention-days: 1

  build-api:
    name: Build API (Azure Functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: ./apps/jatt-api
        run: dotnet restore

      - name: Publish Functions
        working-directory: ./apps/jatt-api
        run: dotnet publish -c Release -o ../../dist/functions

      - name: Create deployment package
        run: |
          cd dist
          zip -r api.zip functions

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-artifact
          path: dist/api.zip
          retention-days: 1

  build-mobile:
    name: Build Mobile (React Native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TODO: get android builds working
      - name: Build React Native (Android)
        run: pnpm nx build jatt-mobile

      # - name: Upload mobile artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: mobile-artifact
      #     path: apps/jatt-mobile/android/app/build/outputs/apk
      #     retention-days: 1
