name: Build and Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '24'
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

# These permissions are required for OIDC token generation
permissions:
  id-token: write # Required for requesting the OIDC JWT
  contents: read # Required for actions/checkout

jobs:
  build-web:
    name: Build Web (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Angular Web App
        run: pnpm nx build jatt-web --configuration=production

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-artifact
          path: dist/apps/jatt-web/browser
          retention-days: 1

  build-api:
    name: Build API (Azure Functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: ./apps/jatt-api
        run: dotnet restore

      - name: Publish Functions
        working-directory: ./apps/jatt-api
        run: dotnet publish -c Release -o ../../dist/functions

      - name: Create deployment package
        run: |
          cd dist
          zip -r api.zip functions

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-artifact
          path: dist/api.zip
          retention-days: 1

  build-mobile:
    name: Build Mobile (React Native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build React Native (Android)
        run: pnpm nx build jatt-mobile --platform=android

      - name: Upload mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-artifact
          path: apps/jatt-mobile/android/app/build/outputs/apk
          retention-days: 1

  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create \
              --name "rg-jatt-dev" \
              --location westeurope

      - name: Deploy Infrastructure
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: 'rg-jatt-dev'
          template: ./infra/main.bicep
          parameters: ./infra/parameters.bicepparam

  deploy-web:
    name: Deploy Web
    needs: [build-web, deploy-infra]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web-artifact

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Static Web App
        run: |
          az staticwebapp tasks execute \
            --name "stapp-jatt-dev" \
            --task-name "upload" \
            --secret VITE_API_URL=${{ vars.FUNCTIONS_URL }}

      - name: Azure Logout
        run: az logout

  deploy-api:
    name: Deploy API
    needs: [build-api, deploy-infra]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api-artifact

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --resource-group "rg-jatt-${{ inputs.environment }}" \
            --name "func-jatt-${{ inputs.environment }}" \
            --src api.zip

      - name: Azure Logout
        run: az logout
